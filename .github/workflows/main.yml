name: Scrape and analyse

on:
  workflow_dispatch:

jobs:
  scrape-and-analyse:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------
      # Get repository
      # --------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------
      # Python
      # --------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: python scripts/scrape.py

      # --------------------
      # R
      # --------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # --------------------
      # Cache R packages
      # --------------------
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/R/x86_64-pc-linux-gnu-library/4.3
          key: ${{ runner.os }}-r-packages-${{ hashFiles('scripts/pooled pv.R') }}
          restore-keys: |
            ${{ runner.os }}-r-packages-

      # --------------------
      # Install R packages
      # --------------------
      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(
            c("tidyverse", "metafor", "DescTools", "scales"),
            repos = "https://cloud.r-project.org"
          )

      # --------------------
      # Check R packages
      # --------------------
      - name: Check R packages
        shell: Rscript {0}
        run: |
          library(tidyverse)
          library(metafor)
          library(DescTools)
          library(scales)
          print("All required R packages loaded successfully")

      # --------------------
      # Run R analysis
      # --------------------
      - name: Run R analysis
        run: Rscript "scripts/pooled pv.R"

      # --------------------
      # Save outputs
      # --------------------
      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/data.csv
          git add output/figures/

          git commit -m "Update scraped data and analysis" || echo "No changes to commit"

          git push
