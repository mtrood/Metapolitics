name: Scrape and analyse
on:
  workflow_dispatch:
jobs:
  scrape-and-analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # --------------------
      # Python
      # --------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scraper
        run: python scripts/scrape.py
      # --------------------
      # R
      # --------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('scripts/pooled_pv.R') }}
          restore-keys: r-${{ runner.os }}-
      - name: Install R packages
        run: |
          Rscript -e "
            pkgs <- c('tidyverse', 'metafor', 'DescTools', 'scales')
            install.packages(pkgs, repos = 'https://packagemanager.posit.co/cran/__linux__/jammy/latest')
            invisible(lapply(pkgs, library, character.only = TRUE))
          "
      - name: Clear old figures and recreate directory
        run: |
          rm -rf output/figures
          mkdir -p output/figures
      - name: Run R analysis
        run: Rscript "scripts/pooled pv.R"
      # --------------------
      # Save outputs
      # --------------------
      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin main
          git rebase origin/main
          git add data/raw/data.csv
          git add output/figures/
          git commit -m "Update scraped data and analysis" || echo "No changes to commit"
          git push origin main
