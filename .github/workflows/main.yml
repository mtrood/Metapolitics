name: Scrape and analyse

on:
  # schedule:
  #   - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  scrape-and-analyse:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------
      # Get repository
      # --------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------
      # Python
      # --------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: python scripts/scrape.py

      # --------------------
      # R
      # --------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("tidyverse","metafor","DescTools", "scales"), repos="https://cloud.r-project.org")'

      - name: Run R analysis
        run: Rscript "scripts/pooled pv.R"

      # --------------------
      # Save outputs
      # --------------------
      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/raw/data.csv
          git add output/figures/

          git commit -m "Update scraped data and analysis" || echo "No changes to commit"

          git push
